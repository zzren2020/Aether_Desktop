[package]
name = "aether-desktop"
version = "1.2.5"
description = "Aether Desktop - Windows edition"
authors = ["Cluvex Studio"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
# Wintun — معادل ویندوزیِ VpnService + hev-tun در اندروید
wintun = "0.5"
# >>> AETHER-APP-FIX tun-relay-goes-live
# رلهٔ فضای‌کاربرِ TUN→SOCKS5 — همان چیزی که کامنتِ بالا («اگر روزی رلهٔ
# فضای‌کاربرِ TUN→SOCKS5 نوشته شود، همان‌جا برمی‌گردند») پیش‌بینی کرده بود.
#   * smoltcp — پشتهٔ TCP/IP فضای‌کاربر: بسته‌های خامِ Wintun را می‌گیرد و
#     جریانِ TCP و دیتاگرامِ UDP واقعی تحویل می‌دهد (معادل hev-socks5-tunnel
#     در اندروید که tun2socks را می‌سازد).
#   * tokio — زمان‌اجرای async برای دمیدنِ مسیرِ رله (کپیِ دوسویهٔ SOCKS5،
#     انجمنِ UDP، چرخهٔ poll). tauri خودش روی tokio می‌نشیند.
smoltcp = { version = "0.12", default-features = false, features = [
  "std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp",
] }
tokio = { version = "1", features = [
  "rt", "net", "io-util", "time", "sync",
] }
# <<< AETHER-APP-FIX tun-relay-goes-live
# ۱.۲.۵-perf — `ipstack` و `tokio` از این‌جا برداشته شدند.
#
# هیچ‌یک در `src-tauri/src/` استفاده نمی‌شد: تنها اشارهٔ `ipstack` یک کامنت در
# سرِ `tun.rs` بود («ترافیک TUN → SOCKS5») که مسیرِ دادهٔ *فعلی* نیست، و `tokio`
# حتی یک بار هم نامش برده نشده بود. هر دو زمانِ بیلد و حجمِ باینری را می‌خوردند
# — `tokio` با `rt-multi-thread` یک زمان‌اجرای کامل را کامپایل می‌کرد.
#
# اگر روزی رلهٔ فضای‌کاربرِ TUN→SOCKS5 نوشته شود، همان‌جا برمی‌گردند.
# native-tls: دست‌دادن TLS برای جای‌یابی IP روی 443 (معادل tlsWrap موبایل). در ویندوز از SChannel بومی استفاده می‌کند.
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Threading",
  "Win32_Security",
  # v12: DPAPI (CryptProtectData) — انبار رازِ مهرشدهٔ کلید API.
  "Win32_Security_Cryptography",
] }

[profile.release]
# معادل minifyEnabled/R8 در اندروید — باینری کوچک و بدون سمبل اضافی.
#
# ۱.۲.۵-perf: `opt-level` از "s" به 3 آمد. "s" به کامپایلر می‌گوید حجم را بر
# سرعت مقدم بدارد — یعنی درست برخلافِ چیزی که شکایتِ این نسخه است. آنچه در
# عمل قربانی می‌شد، inline‌شدن و باز‌کردنِ حلقه‌ها در همان مسیرهایی است که
# داغ‌اند: `copy_counted` در `share.rs`، پارسِ سطربه‌سطرِ لاگِ موتور، و
# `snapshot()` که پنج بار در ثانیه صدا زده می‌شود.
#
# بهایش چند صد کیلوبایت باینریِ بیشتر است؛ `lto` و `codegen-units = 1` سرِ
# جایشان می‌مانند و بخشی از آن را پس می‌گیرند.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
